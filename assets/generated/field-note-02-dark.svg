<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Field note 02: Visible intelligence</title>
  <desc id="desc">Sources, decisions and limits belong in the interface—not behind the curtain.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2D3544" stroke-width="1" opacity=".42"/>
    </pattern>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#8BA4FF" opacity=".2"/>
      <rect x="4" y="4" width="2" height="2" fill="#FF835C" opacity=".16"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
      .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .45px; }
      .body { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .editorial { font: 700 32px Georgia, 'Times New Roman', serif; }
      .display { font: 700 48px Georgia, 'Times New Roman', serif; letter-spacing: -1.5px; }

    </style>
  </defs>
  <rect width="900" height="280" rx="12" fill="#0B0D12"/>
  <rect x="10" y="10" width="880" height="260" rx="8" fill="url(#grid)" stroke="#F4ECDE" stroke-width="2"/>
<path d="M10 58H890M520 58V270" stroke="#F4ECDE" stroke-width="2"/>
  <text x="32" y="40" class="label" fill="#FF835C">FIELD NOTE / 02</text>
  <text x="868" y="40" class="label" text-anchor="end" fill="#B8AF9F">WORKING PRINCIPLE</text>
  <text x="34" y="116" class="serif" font-size="39" font-weight="700" fill="#F4ECDE">Visible intelligence</text>
  <text x="34" y="158" class="body" fill="#B8AF9F"><tspan x="34" dy="0">Sources, decisions and limits belong in the</tspan><tspan x="34" dy="24">interface—not behind the curtain.</tspan></text>
  <g transform="translate(570 74)"><path d="M0 84h66l32-42 52 92 46-68 48 38h82" fill="none" stroke="#8BA4FF" stroke-width="5"/><circle cx="150" cy="134" r="12" fill="#FF835C"/><path d="M0 164h326M0 184h236" stroke="#2D3544" stroke-width="3"/><text x="326" y="210" class="label" text-anchor="end" fill="#B8AF9F">SOURCE → LIMIT → RESPONSE</text></g>
</svg>
