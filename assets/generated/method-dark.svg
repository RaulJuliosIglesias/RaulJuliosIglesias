<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
  <title id="title">How the worlds are made</title>
  <desc id="desc">A six-stage loop: Observe, Frame, Prototype, Build, Tune, Release. It crosses the disciplines Space, Systems and Intelligence.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2D3544" stroke-width="1" opacity=".42"/>
    </pattern>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#8BA4FF" opacity=".2"/>
      <rect x="4" y="4" width="2" height="2" fill="#FF835C" opacity=".16"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
      .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .45px; }
      .body { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .editorial { font: 700 32px Georgia, 'Times New Roman', serif; }
      .display { font: 700 48px Georgia, 'Times New Roman', serif; letter-spacing: -1.5px; }

    </style>
  </defs>
  <rect width="900" height="510" rx="12" fill="#0B0D12"/>
  <rect x="10" y="10" width="880" height="490" rx="8" fill="url(#grid)" stroke="#F4ECDE" stroke-width="2"/>
<text x="34" y="48" class="label" fill="#FF835C">ACT II / HOW THE WORLDS ARE MADE</text>
  <text x="866" y="48" class="label" text-anchor="end" fill="#B8AF9F">A REPEATABLE LOOP, NOT A RECIPE</text>
  <path d="M34 68H866" stroke="#F4ECDE" stroke-width="2"/>
  <path d="M55 137C174 137 185 183 307 183S436 137 559 137 686 183 811 183" fill="none" stroke="#8BA4FF" stroke-width="4"/>
  <g transform="translate(55 137)">
      <circle r="29" fill="#121720" stroke="#FF835C" stroke-width="3"/>
      <text y="4" class="label" text-anchor="middle" fill="#FF835C">01</text>
      <text y="52" class="small" text-anchor="middle" fill="#B8AF9F">OBSERVE</text>
    </g><g transform="translate(181 183)">
      <circle r="29" fill="#121720" stroke="#F4ECDE" stroke-width="3"/>
      <text y="4" class="label" text-anchor="middle" fill="#F4ECDE">02</text>
      <text y="52" class="small" text-anchor="middle" fill="#B8AF9F">FRAME</text>
    </g><g transform="translate(307 137)">
      <circle r="29" fill="#121720" stroke="#F4ECDE" stroke-width="3"/>
      <text y="4" class="label" text-anchor="middle" fill="#F4ECDE">03</text>
      <text y="52" class="small" text-anchor="middle" fill="#B8AF9F">PROTOTYPE</text>
    </g><g transform="translate(433 183)">
      <circle r="29" fill="#121720" stroke="#F4ECDE" stroke-width="3"/>
      <text y="4" class="label" text-anchor="middle" fill="#F4ECDE">04</text>
      <text y="52" class="small" text-anchor="middle" fill="#B8AF9F">BUILD</text>
    </g><g transform="translate(559 137)">
      <circle r="29" fill="#121720" stroke="#F4ECDE" stroke-width="3"/>
      <text y="4" class="label" text-anchor="middle" fill="#F4ECDE">05</text>
      <text y="52" class="small" text-anchor="middle" fill="#B8AF9F">TUNE</text>
    </g><g transform="translate(685 183)">
      <circle r="29" fill="#121720" stroke="#FF835C" stroke-width="3"/>
      <text y="4" class="label" text-anchor="middle" fill="#FF835C">06</text>
