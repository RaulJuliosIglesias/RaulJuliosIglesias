<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Field note 01: Spatial interfaces</title>
  <desc id="desc">Navigation, camera and depth become useful when they help someone form a mental model.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D2C4AD" stroke-width="1" opacity=".42"/>
    </pattern>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#244BC4" opacity=".2"/>
      <rect x="4" y="4" width="2" height="2" fill="#C9431C" opacity=".16"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
      .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .45px; }
      .body { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .editorial { font: 700 32px Georgia, 'Times New Roman', serif; }
      .display { font: 700 48px Georgia, 'Times New Roman', serif; letter-spacing: -1.5px; }

    </style>
  </defs>
  <rect width="900" height="280" rx="12" fill="#F2EADB"/>
  <rect x="10" y="10" width="880" height="260" rx="8" fill="url(#grid)" stroke="#151515" stroke-width="2"/>
<path d="M10 58H890M520 58V270" stroke="#151515" stroke-width="2"/>
  <text x="32" y="40" class="label" fill="#C9431C">FIELD NOTE / 01</text>
  <text x="868" y="40" class="label" text-anchor="end" fill="#635D52">WORKING PRINCIPLE</text>
  <text x="34" y="116" class="serif" font-size="39" font-weight="700" fill="#151515">Spatial interfaces</text>
  <text x="34" y="158" class="body" fill="#635D52"><tspan x="34" dy="0">Navigation, camera and depth become useful when</tspan><tspan x="34" dy="24">they help someone form a mental model.</tspan></text>
  <g transform="translate(680 140)" fill="none"><ellipse rx="130" ry="62" stroke="#244BC4" stroke-width="4"/><ellipse rx="76" ry="116" stroke="#D2C4AD" stroke-width="3" transform="rotate(55)"/><circle cx="-88" cy="-43" r="10" fill="#C9431C"/><path d="M-22 0h44M0-22v44" stroke="#151515" stroke-width="3"/></g>
</svg>
