<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">03 — MAVI: Access / Cultural Space</title>
  <desc id="desc">Museo Accesible Virtual Interactivo: a digital museum conceived as an open route into culture. Key decisions: Access from the start, Open circulation, Narrative wayfinding.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2D3544" stroke-width="1" opacity=".42"/>
    </pattern>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#8BA4FF" opacity=".2"/>
      <rect x="4" y="4" width="2" height="2" fill="#FF835C" opacity=".16"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
      .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .45px; }
      .body { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .editorial { font: 700 32px Georgia, 'Times New Roman', serif; }
      .display { font: 700 48px Georgia, 'Times New Roman', serif; letter-spacing: -1.5px; }

    </style>
  </defs>
  <rect width="900" height="400" rx="12" fill="#0B0D12"/>
  <rect x="10" y="10" width="880" height="380" rx="8" fill="url(#grid)" stroke="#F4ECDE" stroke-width="2"/>
<path d="M10 58H890M493 58V390" stroke="#F4ECDE" stroke-width="2"/>
  <text x="32" y="40" class="label" fill="#FF835C">WORLD / 03</text>
  <text x="868" y="40" class="label" text-anchor="end" fill="#B8AF9F">ACCESS / CULTURAL SPACE</text>
  <g transform="translate(34 88)">
    <text class="serif" font-size="44" font-weight="700" fill="#F4ECDE">MAVI</text>

    <text x="0" y="62" class="body" fill="#B8AF9F"><tspan x="0" dy="0">Museo Accesible Virtual Interactivo: a digital</tspan><tspan x="0" dy="24">museum conceived as an open route into culture.</tspan></text>
    <path d="M0 184H410" stroke="#2D3544" stroke-width="2"/>
    <text y="214" class="small" fill="#FF835C">01  ACCESS FROM THE START</text><text y="239" class="small" fill="#F4ECDE">02  OPEN CIRCULATION</text><text y="264" class="small" fill="#F4ECDE">03  NARRATIVE WAYFINDING</text>
  </g>
  <g transform="translate(540 54)" fill="none">
    <path d="M16 26h304v234H16zM16 104h92V26M108 104h88v76h124M196 104V26M108 180v80M252 180v80" stroke="#F4ECDE" stroke-width="4"/>
    <path d="M108 79v50M196 79v50M227 180h50" stroke="#0B0D12" stroke-width="9"/>
    <path d="M108 80a24 24 0 0 1 24 24M196 80a24 24 0 0 0-24 24M228 180a24 24 0 0 1 24 24" stroke="#FF835C" stroke-width="3"/>
    <path d="M54 218C80 194 102 210 128 194s55-4 74-31 41-17 69-38" stroke="#8BA4FF" stroke-width="4" stroke-dasharray="6 8"/>
    <circle cx="54" cy="218" r="8" fill="#FF835C"/><circle cx="271" cy="125" r="8" fill="#8BA4FF"/>
    <text x="320" y="284" class="label" text-anchor="end" fill="#B8AF9F">OPEN CIRCULATION</text>
  </g>
  <text x="868" y="382" class="label" text-anchor="end" fill="#B8AF9F">CASE STUDY + LIVE WORLD</text>
</svg>
