<svg xmlns="http://www.w3.org/2000/svg" width="420" height="804" viewBox="0 0 420 804" role="img" aria-labelledby="title desc">
  <title id="title">Mobile atlas of six built worlds</title>
  <desc id="desc">A vertical route through Renault 5 Turbo 3E, Gaussian Splatting Web, MAVI, Dreamly, KOVA and SolarScope.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D2C4AD" stroke-width="1" opacity=".42"/>
    </pattern>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#244BC4" opacity=".2"/>
      <rect x="4" y="4" width="2" height="2" fill="#C9431C" opacity=".16"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
      .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .45px; }
      .body { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .editorial { font: 700 32px Georgia, 'Times New Roman', serif; }
      .display { font: 700 48px Georgia, 'Times New Roman', serif; letter-spacing: -1.5px; }
      .scan { animation: scan 6s linear infinite; }
      .pulse { transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .route { stroke-dasharray: 8 12; animation: route 10s linear infinite; }
      @keyframes scan { from { transform: translateY(-8px); } to { transform: translateY(812px); } }
      @keyframes pulse { 50% { opacity: .25; transform: scale(.82); } }
      @keyframes route { to { stroke-dashoffset: -200; } }
      @media (prefers-reduced-motion: reduce) { .scan, .pulse, .route { animation: none; } }
    </style>
  </defs>
  <rect width="420" height="804" rx="12" fill="#F2EADB"/>
  <rect x="10" y="10" width="400" height="784" rx="8" fill="url(#grid)" stroke="#151515" stroke-width="2"/>
<text x="22" y="39" class="label" fill="#C9431C">ACT I / SIX WORLDS</text>
  <text x="398" y="39" class="label" text-anchor="end" fill="#635D52">FIELD MAP</text>
  <path d="M10 58H410" stroke="#151515" stroke-width="2"/>
  <path class="route" d="M54 112V704" stroke="#244BC4" stroke-width="4" fill="none"/>
  <g transform="translate(32 86)">
      <rect width="356" height="92" rx="5" fill="#FFF8EC" stroke="#C9431C" stroke-width="3"/>
      <path d="M58 0v92M0 30h356" stroke="#D2C4AD"/>
      <text x="17" y="21" class="label" fill="#C9431C">01</text>
      <text x="72" y="21" class="label" fill="#635D52">MOTION / INTERACTIVE 3D</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#151515">Renault 5 Turbo 3E</text>
      <circle class="pulse" cx="330" cy="61" r="7" fill="#C9431C"/>
    </g><g transform="translate(32 198)">
      <rect width="356" height="92" rx="5" fill="#FFF8EC" stroke="#151515" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#D2C4AD"/>
      <text x="17" y="21" class="label" fill="#C9431C">02</text>
      <text x="72" y="21" class="label" fill="#635D52">VOLUME / SPATIAL WEB</text>
      <text x="76" y="62" class="serif" font-size="18" font-weight="700" fill="#151515">Gaussian Splatting Web</text>
      <circle class="" cx="330" cy="61" r="7" fill="#244BC4"/>
    </g><g transform="translate(32 310)">
      <rect width="356" height="92" rx="5" fill="#FFF8EC" stroke="#151515" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#D2C4AD"/>
      <text x="17" y="21" class="label" fill="#C9431C">03</text>
      <text x="72" y="21" class="label" fill="#635D52">ACCESS / CULTURAL SPACE</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#151515">MAVI</text>
      <circle class="" cx="330" cy="61" r="7" fill="#244BC4"/>
    </g><g transform="translate(32 422)">
      <rect width="356" height="92" rx="5" fill="#FFF8EC" stroke="#151515" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#D2C4AD"/>
      <text x="17" y="21" class="label" fill="#C9431C">04</text>
      <text x="72" y="21" class="label" fill="#635D52">EVIDENCE / HUMAN-FIRST AI</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#151515">Dreamly</text>
      <circle class="" cx="330" cy="61" r="7" fill="#244BC4"/>
    </g><g transform="translate(32 534)">
      <rect width="356" height="92" rx="5" fill="#FFF8EC" stroke="#151515" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#D2C4AD"/>
      <text x="17" y="21" class="label" fill="#C9431C">05</text>
      <text x="72" y="21" class="label" fill="#635D52">ORCHESTRATION / AGENT SYSTEM</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#151515">KOVA</text>
      <circle class="" cx="330" cy="61" r="7" fill="#244BC4"/>
    </g><g transform="translate(32 646)">
      <rect width="356" height="92" rx="5" fill="#FFF8EC" stroke="#151515" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#D2C4AD"/>
      <text x="17" y="21" class="label" fill="#C9431C">06</text>
      <text x="72" y="21" class="label" fill="#635D52">ENERGY / ENGINEERING TOOL</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#151515">SolarScope</text>
      <circle class="" cx="330" cy="61" r="7" fill="#244BC4"/>
    </g>
  <text x="398" y="786" class="label" text-anchor="end" fill="#C9431C">OPEN THE DOSSIERS ↓</text>
</svg>
