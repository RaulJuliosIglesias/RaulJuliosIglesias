<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
  <title id="title">Atlas of six built worlds</title>
  <desc id="desc">A connected field map of Renault 5 Turbo 3E, Gaussian Splatting Web, MAVI, Dreamly, KOVA and SolarScope.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2D3544" stroke-width="1" opacity=".42"/>
    </pattern>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#8BA4FF" opacity=".2"/>
      <rect x="4" y="4" width="2" height="2" fill="#FF835C" opacity=".16"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
      .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .45px; }
      .body { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .editorial { font: 700 32px Georgia, 'Times New Roman', serif; }
      .display { font: 700 48px Georgia, 'Times New Roman', serif; letter-spacing: -1.5px; }
      .scan { animation: scan 6s linear infinite; }
      .pulse { transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .route { stroke-dasharray: 8 12; animation: route 10s linear infinite; }
      @keyframes scan { from { transform: translateY(-8px); } to { transform: translateY(558px); } }
      @keyframes pulse { 50% { opacity: .25; transform: scale(.82); } }
      @keyframes route { to { stroke-dashoffset: -200; } }
      @media (prefers-reduced-motion: reduce) { .scan, .pulse, .route { animation: none; } }
    </style>
  </defs>
  <rect width="900" height="550" rx="12" fill="#0B0D12"/>
  <rect x="10" y="10" width="880" height="530" rx="8" fill="url(#grid)" stroke="#F4ECDE" stroke-width="2"/>
<text x="34" y="49" class="label" fill="#FF835C">ACT I / SIX WORLDS</text>
  <text x="866" y="49" class="label" text-anchor="end" fill="#B8AF9F">SELECTED FIELD MAP</text>
  <path class="route" d="M184 228C220 278 326 286 432 190S626 192 674 230 714 303 704 334M214 340C252 308 333 318 396 370" fill="none" stroke="#8BA4FF" stroke-width="3" opacity=".7"/>
  <path d="M34 68H866" stroke="#F4ECDE" stroke-width="2"/>
  <g transform="translate(76 110)">
      <rect width="220" height="118" rx="5" fill="#121720" stroke="#FF835C" stroke-width="3"/>
      <path d="M0 30H220M38 0V30" stroke="#2D3544"/>
      <text x="12" y="20" class="label" fill="#FF835C">01</text>
      <text x="50" y="20" class="label" fill="#B8AF9F">MOTION</text>
      <text x="14" y="62" class="serif" font-size="23" font-weight="700" fill="#F4ECDE">Renault 5 Turbo 3E</text>
      <text x="14" y="88" class="small" fill="#8BA4FF">INTERACTIVE 3D</text>
      <path d="M14 102h116" stroke="#2D3544" stroke-width="2"/>
      <circle class="pulse" cx="196" cy="94" r="7" fill="#FF835C"/>
    </g><g transform="translate(324 72)">
      <rect width="220" height="118" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M0 30H220M38 0V30" stroke="#2D3544"/>
      <text x="12" y="20" class="label" fill="#FF835C">02</text>
      <text x="50" y="20" class="label" fill="#B8AF9F">VOLUME</text>
      <text x="14" y="62" class="serif" font-size="19" font-weight="700" fill="#F4ECDE">Gaussian Splatting Web</text>
      <text x="14" y="88" class="small" fill="#8BA4FF">SPATIAL WEB</text>
      <path d="M14 102h116" stroke="#2D3544" stroke-width="2"/>
      <circle class="" cx="196" cy="94" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(568 112)">
      <rect width="220" height="118" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M0 30H220M38 0V30" stroke="#2D3544"/>
      <text x="12" y="20" class="label" fill="#FF835C">03</text>
      <text x="50" y="20" class="label" fill="#B8AF9F">ACCESS</text>
      <text x="14" y="62" class="serif" font-size="23" font-weight="700" fill="#F4ECDE">MAVI</text>
      <text x="14" y="88" class="small" fill="#8BA4FF">CULTURAL SPACE</text>
      <path d="M14 102h116" stroke="#2D3544" stroke-width="2"/>
      <circle class="" cx="196" cy="94" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(104 340)">
      <rect width="220" height="118" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M0 30H220M38 0V30" stroke="#2D3544"/>
      <text x="12" y="20" class="label" fill="#FF835C">04</text>
      <text x="50" y="20" class="label" fill="#B8AF9F">EVIDENCE</text>
      <text x="14" y="62" class="serif" font-size="23" font-weight="700" fill="#F4ECDE">Dreamly</text>
      <text x="14" y="88" class="small" fill="#8BA4FF">HUMAN-FIRST AI</text>
      <path d="M14 102h116" stroke="#2D3544" stroke-width="2"/>
      <circle class="" cx="196" cy="94" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(354 370)">
      <rect width="220" height="118" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M0 30H220M38 0V30" stroke="#2D3544"/>
      <text x="12" y="20" class="label" fill="#FF835C">05</text>
      <text x="50" y="20" class="label" fill="#B8AF9F">ORCHESTRATION</text>
      <text x="14" y="62" class="serif" font-size="23" font-weight="700" fill="#F4ECDE">KOVA</text>
      <text x="14" y="88" class="small" fill="#8BA4FF">AGENT SYSTEM</text>
      <path d="M14 102h116" stroke="#2D3544" stroke-width="2"/>
      <circle class="" cx="196" cy="94" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(604 334)">
      <rect width="220" height="118" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M0 30H220M38 0V30" stroke="#2D3544"/>
      <text x="12" y="20" class="label" fill="#FF835C">06</text>
      <text x="50" y="20" class="label" fill="#B8AF9F">ENERGY</text>
      <text x="14" y="62" class="serif" font-size="23" font-weight="700" fill="#F4ECDE">SolarScope</text>
      <text x="14" y="88" class="small" fill="#8BA4FF">ENGINEERING TOOL</text>
      <path d="M14 102h116" stroke="#2D3544" stroke-width="2"/>
      <circle class="" cx="196" cy="94" r="7" fill="#8BA4FF"/>
    </g>
  <text x="34" y="532" class="small" fill="#B8AF9F">A ROUTE THROUGH MOTION, VOLUME, ACCESS, EVIDENCE, ORCHESTRATION AND ENERGY.</text>
  <text x="866" y="532" class="label" text-anchor="end" fill="#FF835C">OPEN THE DOSSIERS ↓</text>
</svg>
