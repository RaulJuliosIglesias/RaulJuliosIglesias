<svg xmlns="http://www.w3.org/2000/svg" width="420" height="804" viewBox="0 0 420 804" role="img" aria-labelledby="title desc">
  <title id="title">Mobile atlas of six built worlds</title>
  <desc id="desc">A vertical route through Renault 5 Turbo 3E, Gaussian Splatting Web, MAVI, Dreamly, KOVA and SolarScope.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2D3544" stroke-width="1" opacity=".42"/>
    </pattern>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#8BA4FF" opacity=".2"/>
      <rect x="4" y="4" width="2" height="2" fill="#FF835C" opacity=".16"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
      .small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .45px; }
      .body { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .editorial { font: 700 32px Georgia, 'Times New Roman', serif; }
      .display { font: 700 48px Georgia, 'Times New Roman', serif; letter-spacing: -1.5px; }
      .scan { animation: scan 6s linear infinite; }
      .pulse { transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .route { stroke-dasharray: 8 12; animation: route 10s linear infinite; }
      @keyframes scan { from { transform: translateY(-8px); } to { transform: translateY(812px); } }
      @keyframes pulse { 50% { opacity: .25; transform: scale(.82); } }
      @keyframes route { to { stroke-dashoffset: -200; } }
      @media (prefers-reduced-motion: reduce) { .scan, .pulse, .route { animation: none; } }
    </style>
  </defs>
  <rect width="420" height="804" rx="12" fill="#0B0D12"/>
  <rect x="10" y="10" width="400" height="784" rx="8" fill="url(#grid)" stroke="#F4ECDE" stroke-width="2"/>
<text x="22" y="39" class="label" fill="#FF835C">ACT I / SIX WORLDS</text>
  <text x="398" y="39" class="label" text-anchor="end" fill="#B8AF9F">FIELD MAP</text>
  <path d="M10 58H410" stroke="#F4ECDE" stroke-width="2"/>
  <path class="route" d="M54 112V704" stroke="#8BA4FF" stroke-width="4" fill="none"/>
  <g transform="translate(32 86)">
      <rect width="356" height="92" rx="5" fill="#121720" stroke="#FF835C" stroke-width="3"/>
      <path d="M58 0v92M0 30h356" stroke="#2D3544"/>
      <text x="17" y="21" class="label" fill="#FF835C">01</text>
      <text x="72" y="21" class="label" fill="#B8AF9F">MOTION / INTERACTIVE 3D</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#F4ECDE">Renault 5 Turbo 3E</text>
      <circle class="pulse" cx="330" cy="61" r="7" fill="#FF835C"/>
    </g><g transform="translate(32 198)">
      <rect width="356" height="92" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#2D3544"/>
      <text x="17" y="21" class="label" fill="#FF835C">02</text>
      <text x="72" y="21" class="label" fill="#B8AF9F">VOLUME / SPATIAL WEB</text>
      <text x="76" y="62" class="serif" font-size="18" font-weight="700" fill="#F4ECDE">Gaussian Splatting Web</text>
      <circle class="" cx="330" cy="61" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(32 310)">
      <rect width="356" height="92" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#2D3544"/>
      <text x="17" y="21" class="label" fill="#FF835C">03</text>
      <text x="72" y="21" class="label" fill="#B8AF9F">ACCESS / CULTURAL SPACE</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#F4ECDE">MAVI</text>
      <circle class="" cx="330" cy="61" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(32 422)">
      <rect width="356" height="92" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#2D3544"/>
      <text x="17" y="21" class="label" fill="#FF835C">04</text>
      <text x="72" y="21" class="label" fill="#B8AF9F">EVIDENCE / HUMAN-FIRST AI</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#F4ECDE">Dreamly</text>
      <circle class="" cx="330" cy="61" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(32 534)">
      <rect width="356" height="92" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#2D3544"/>
      <text x="17" y="21" class="label" fill="#FF835C">05</text>
      <text x="72" y="21" class="label" fill="#B8AF9F">ORCHESTRATION / AGENT SYSTEM</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#F4ECDE">KOVA</text>
      <circle class="" cx="330" cy="61" r="7" fill="#8BA4FF"/>
    </g><g transform="translate(32 646)">
      <rect width="356" height="92" rx="5" fill="#121720" stroke="#F4ECDE" stroke-width="2"/>
      <path d="M58 0v92M0 30h356" stroke="#2D3544"/>
      <text x="17" y="21" class="label" fill="#FF835C">06</text>
      <text x="72" y="21" class="label" fill="#B8AF9F">ENERGY / ENGINEERING TOOL</text>
      <text x="76" y="62" class="serif" font-size="22" font-weight="700" fill="#F4ECDE">SolarScope</text>
      <circle class="" cx="330" cy="61" r="7" fill="#8BA4FF"/>
    </g>
  <text x="398" y="786" class="label" text-anchor="end" fill="#FF835C">OPEN THE DOSSIERS ↓</text>
</svg>
