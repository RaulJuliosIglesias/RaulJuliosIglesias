name: Render profile artwork

on:
  pull_request:
    paths:
      - "content/profile.json"
      - "scripts/render-profile.mjs"
      - "assets/avatar/**"
      - ".github/workflows/render-profile.yml"
  push:
    branches: [main]
    paths:
      - "content/profile.json"
      - "scripts/render-profile.mjs"
      - "assets/avatar/**"
      - ".github/workflows/render-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render deterministic SVGs
        run: node scripts/render-profile.mjs

      - name: Verify generated artwork in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- assets/generated

      - name: Commit refreshed artwork
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- assets/generated; then
            echo "Artwork already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git commit -m "Refresh profile artwork [skip ci]"
          git push

