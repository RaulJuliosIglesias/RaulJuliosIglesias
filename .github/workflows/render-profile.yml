name: Validate profile artwork

on:
  pull_request:
    paths:
      - "README.md"
      - "content/profile.json"
      - "assets/artbook-v3/**"
      - "scripts/check-profile.mjs"
      - ".github/workflows/render-profile.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "content/profile.json"
      - "assets/artbook-v3/**"
      - "scripts/check-profile.mjs"
      - ".github/workflows/render-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate profile data, artwork and README
        run: node scripts/check-profile.mjs
