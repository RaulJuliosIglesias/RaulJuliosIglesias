name: Render profile artwork

on:
  pull_request:
    paths:
      - "README.md"
      - "content/profile.json"
      - "scripts/render-profile.mjs"
      - "scripts/check-profile.mjs"
      - "assets/avatar/**"
      - ".github/workflows/render-profile.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "content/profile.json"
      - "scripts/render-profile.mjs"
      - "scripts/check-profile.mjs"
      - "assets/avatar/**"
      - ".github/workflows/render-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate data and deterministic artwork
        run: node scripts/check-profile.mjs

      - name: Check generated artwork for drift
        run: git diff --exit-code -- assets/generated

  refresh:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate data and deterministic artwork
        run: node scripts/check-profile.mjs

      - name: Commit refreshed artwork
        shell: bash
        run: |
          if git diff --quiet -- assets/generated; then
            echo "Artwork already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git commit -m "Refresh profile artwork [skip ci]"
          git push
